spring.application.name=case-assembly-mes
server.port=${PORT:8085}
server.error.include-message=always
spring.datasource.url=jdbc:h2:file:./data/mes-demo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
mes.opc.endpoint=opc.tcp://127.0.0.1:4843
# twin: the web twin in the MES page is the line (no desktop program). opcua: OIP Desktop on this PC.
mes.plc.mode=${MES_PLC_MODE:twin}
mes.cors.origins=${MES_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
